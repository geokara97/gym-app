<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Library - Training Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="page-nav">
            <a href="index.html" class="nav-back">← Back to Dashboard</a>
        </nav>

        <div class="section-header">
            <h1>🏋️ Exercise Library</h1>
            <button class="btn btn-primary" id="add-exercise-btn">+ Add Exercise</button>
        </div>

        <div class="form-group" style="max-width: 300px;">
            <label for="filter-split">Filter by Split</label>
            <select id="filter-split">
                <option value="">All Splits</option>
            </select>
        </div>
        
        <div id="exercises-list">
            <!-- Exercise library will be loaded here -->
        </div>

        <!-- Add Exercise Modal -->
        <div id="exercise-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="exercise-modal-title">Add New Exercise</h3>
                <form id="exercise-form">
                    <div class="form-group">
                        <label for="exercise-name">Exercise Name *</label>
                        <input type="text" id="exercise-name" required>
                    </div>
                    <div class="form-group">
                        <label>Measured By *</label>
                        <div class="radio-group">
                            <label class="checkbox-label">
                                <input type="radio" name="measurement-type" value="reps" checked>
                                <span class="checkbox-text">🔁 Repetitions</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="radio" name="measurement-type" value="duration">
                                <span class="checkbox-text">⏱️ Duration (seconds)</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Split Categories (select one or more) *</label>
                        <div class="checkbox-grid" id="exercise-splits">
                            <!-- Will be populated dynamically -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="exercise-description">Description</label>
                        <textarea id="exercise-description" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="exercise-submit-btn">Add Exercise</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="exercise-library-page.js"></script>
</body>
</html>
