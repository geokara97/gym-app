<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History - Training Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="page-nav">
            <a href="index.html" class="nav-back">← Back to Dashboard</a>
        </nav>

        <div class="section-header">
            <h1>📊 Workout History</h1>
        </div>

        <div class="filters-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="filter-date-from">From Date</label>
                    <input type="date" id="filter-date-from">
                </div>
                <div class="form-group">
                    <label for="filter-date-to">To Date</label>
                    <input type="date" id="filter-date-to">
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" id="apply-filter-btn">Apply Filter</button>
                    <button class="btn btn-secondary" id="reset-filter-btn">Reset</button>
                </div>
            </div>
        </div>
        
        <div id="history-list">
            <!-- Workout history will be loaded here -->
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="workout-history-page.js"></script>
</body>
</html>
